<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سوابق شغلی — خلاصه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAE3D9;
    --ink: #202A33;
    --ink-soft: #5B5449;
    --line: #A6673D;
    --outline: rgba(32,42,51,0.08);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d8d2c6; }
  .canvas{
    width: 1080px;
    min-height: 1920px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    font-family: 'Vazirmatn', sans-serif;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  .watermark{
    position: absolute;
    top: 90px;
    right: 10px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 340px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--outline);
    letter-spacing: -8px;
    user-select: none;
  }

  .chapter-tag{
    position: absolute;
    top: 150px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .chapter-tag .rule{ width:1px; height:130px; background: var(--ink); opacity:0.55; }
  .chapter-tag .label{
    writing-mode: vertical-rl;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    font-weight: 300;
  }

  .content-top{
    margin-top: 430px;
    padding: 0 90px;
    text-align: right;
  }
  .content-top .eyebrow{
    font-size: 22px;
    font-weight: 700;
    color: var(--line);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .content-top h1{
    font-size: 52px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.4;
    letter-spacing: -0.5px;
  }

  .stats{
    margin-top: 60px;
    padding: 34px 90px;
    display: flex;
    border-top: 1px solid rgba(32,42,51,0.25);
    border-bottom: 1px solid rgba(32,42,51,0.25);
  }
  .stats .stat-item{ flex:1; text-align:center; padding: 0 8px; }
  .stats .stat-item:not(:last-child){ border-left: 1px solid rgba(32,42,51,0.25); }
  .stats .stat-item .num{
    font-family: 'EB Garamond', serif;
    font-weight: 600;
    font-size: 58px;
    color: var(--line);
    display: block;
    line-height: 1;
    margin-bottom: 14px;
  }
  .stats .stat-item .lbl{
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.4;
  }

  .section-label{
    margin-top: 60px;
    padding: 0 90px;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }

  .current-list{
    margin-top: 24px;
    padding: 0 90px;
  }
  .job-row{
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 26px 0;
    border-bottom: 1px solid rgba(32,42,51,0.18);
  }
  .job-badge{
    font-size: 13px;
    font-weight: 700;
    color: var(--bg);
    background: var(--line);
    padding: 6px 14px;
    border-radius: 100px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .job-main{ flex:1; text-align:right; }
  .job-title{ font-size: 28px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .job-company{ font-size: 18px; font-weight: 300; color: var(--ink-soft); }
  .job-loc{
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .bottom{
    margin-top: auto;
    padding: 70px 90px 90px 90px;
  }
  .icon-row{ display:flex; align-items:center; gap: 30px; margin-bottom: 50px; }
  .icon-row .rule{ width:1px; height:180px; background: var(--ink); opacity:0.3; }
  .icon-box{ width:180px; height:180px; }
  .icon-box svg{ width:100%; height:100%; }

  .footer{
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer .index{
    font-family:'EB Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink-soft);
    letter-spacing:1px;
    direction: ltr;
  }
  .footer .caption{
    font-size: 17px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="canvas">

  <div class="watermark">+10</div>

  <div class="chapter-tag">
    <div class="rule"></div>
    <div class="label">فصل پنجم — سوابق شغلی</div>
  </div>

  <div class="content-top">
    <div class="eyebrow">سوابق شغلی و تجربه حرفه‌ای</div>
    <h1>بیش از ۱۰ سال تجربه<br>در فناوری و هوش مصنوعی</h1>
  </div>

  <div class="stats">
    <div class="stat-item">
      <span class="num">+10</span>
      <span class="lbl">سال تجربه</span>
    </div>
    <div class="stat-item">
      <span class="num">11</span>
      <span class="lbl">سازمان</span>
    </div>
    <div class="stat-item">
      <span class="num">11</span>
      <span class="lbl">سمت شغلی</span>
    </div>
    <div class="stat-item">
      <span class="num">2</span>
      <span class="lbl">سمت مدیریتی</span>
    </div>
  </div>

  <div class="section-label">سمت‌های فعلی</div>

  <div class="current-list">
    <div class="job-row">
      <span class="job-badge">تاکنون</span>
      <div class="job-main">
        <div class="job-title">مدیر عامل</div>
        <div class="job-company">شرکت هوشمند پرداز صفاهان</div>
      </div>
      <span class="job-loc">اصفهان · ۱۴۰۴</span>
    </div>
    <div class="job-row">
      <span class="job-badge">تاکنون</span>
      <div class="job-main">
        <div class="job-title">مدرس</div>
        <div class="job-company">موسسه آی‌تک</div>
      </div>
      <span class="job-loc">اصفهان · ۱۴۰۴</span>
    </div>
  </div>

  <div class="bottom">
    <div class="icon-row">
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="15" y="35" width="70" height="45" rx="4" stroke="#A6673D" stroke-width="2.5"/>
          <path d="M38 35 V26 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 V35" stroke="#A6673D" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="15" y1="55" x2="85" y2="55" stroke="#A6673D" stroke-width="2"/>
          <rect x="44" y="50" width="12" height="10" rx="1.5" fill="#EAE3D9" stroke="#A6673D" stroke-width="2"/>
        </svg>
      </div>
      <div class="rule"></div>
    </div>
    <div class="footer">
      <div class="index">5.1</div>
      <div class="caption">Experience&nbsp;·&nbsp;Overview</div>
    </div>
  </div>

</div>

</body>
</html>
