<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اساتید — دکتر منثوری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAE3D9;
    --ink: #202A33;
    --ink-soft: #5B5449;
    --line: #A6673D;
    --outline: rgba(32,42,51,0.08);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d8d2c6; }
  .canvas{
    width: 1080px;
    min-height: 1920px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    font-family: 'Vazirmatn', sans-serif;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  .watermark{
    position: absolute;
    top: 90px;
    right: 30px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 340px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--outline);
    letter-spacing: -6px;
    user-select: none;
  }

  .chapter-tag{
    position: absolute;
    top: 150px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .chapter-tag .rule{ width:1px; height:130px; background: var(--ink); opacity:0.55; }
  .chapter-tag .label{
    writing-mode: vertical-rl;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    font-weight: 300;
  }

  .content-top{
    margin-top: 430px;
    padding: 0 90px;
    text-align: right;
  }
  .content-top .eyebrow{
    font-size: 22px;
    font-weight: 700;
    color: var(--line);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .content-top h1{
    font-size: 54px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.4;
    letter-spacing: -0.5px;
  }

  .story{
    margin-top: 50px;
    padding: 0 90px;
  }
  .quote-mark{
    font-family: 'EB Garamond', serif;
    font-size: 130px;
    color: var(--line);
    opacity: 0.3;
    line-height: 0.6;
    margin-bottom: 10px;
  }
  .story-text{
    font-size: 32px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.9;
    text-align: right;
    max-width: 820px;
  }

  .bottom{
    margin-top: auto;
    padding: 60px 90px 90px 90px;
  }
  .icon-row{ display:flex; align-items:center; gap: 30px; margin-bottom: 50px; }
  .icon-row .rule{ width:1px; height:180px; background: var(--ink); opacity:0.3; }
  .icon-box{ width:180px; height:180px; }
  .icon-box svg{ width:100%; height:100%; }

  .footer{
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer .index{
    font-family:'EB Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink-soft);
    letter-spacing:1px;
    direction: ltr;
  }
  .footer .caption{
    font-size: 17px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="canvas">

  <div class="chapter-tag">
    <div class="rule"></div>
    <div class="label">فصل هفتم — همکاری و اساتید</div>
  </div>

  <div class="content-top">
    <div class="eyebrow">یک آشنایی ساده</div>
    <h1>دکتر منثوری - هیئت علمی دانشگاه شاهد</h1>
  </div>

  <div class="story">
    <div class="quote-mark">&laquo;</div>
    <div class="story-text">با دکتر منثوری کاملاً اتفاقی، از طریق یکی از شاگردهاشون آشنا شدم.<br>همین آشنایی ساده، به یه همکاری علمی و در نهایت چاپ یه مقاله‌ی مشترک ختم شد.</div>
  </div>

  <div class="bottom">
    <div class="icon-row">
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="38" cy="50" r="26" stroke="#A6673D" stroke-width="2.5"/>
          <circle cx="62" cy="50" r="26" stroke="#A6673D" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="rule"></div>
    </div>
    <div class="footer">
      <div class="index">7.2</div>
      <div class="caption">Dr.&nbsp;Manthouri</div>
    </div>
  </div>

</div>

</body>
</html>
