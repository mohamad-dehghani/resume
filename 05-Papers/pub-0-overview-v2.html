<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقالات — خلاصه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAE3D9;
    --ink: #202A33;
    --ink-soft: #5B5449;
    --line: #A6673D;
    --outline: rgba(32,42,51,0.08);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d8d2c6; }
  .canvas{
    width: 1080px;
    min-height: 1920px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    font-family: 'Vazirmatn', sans-serif;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  .watermark{
    position: absolute;
    top: 60px;
    right: -10px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 480px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--outline);
    letter-spacing: -10px;
    user-select: none;
  }

  .chapter-tag{
    position: absolute;
    top: 150px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .chapter-tag .rule{ width:1px; height:130px; background: var(--ink); opacity:0.55; }
  .chapter-tag .label{
    writing-mode: vertical-rl;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    font-weight: 300;
  }

  .content-top{
    margin-top: 430px;
    padding: 0 90px;
    text-align: right;
  }
  .content-top .eyebrow{
    font-size: 22px;
    font-weight: 700;
    color: var(--line);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .content-top h1{
    font-size: 54px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.4;
    letter-spacing: -0.5px;
  }

  /* primary — Scholar metrics, the "wow" row */
  .stats-primary{
    margin-top: 70px;
    padding: 40px 90px;
    display: flex;
    border-top: 1px solid rgba(32,42,51,0.25);
    border-bottom: 1px solid rgba(32,42,51,0.25);
  }
  .stats-primary .stat-item{ flex:1; text-align:center; padding: 0 10px; }
  .stats-primary .stat-item:not(:last-child){ border-left: 1px solid rgba(32,42,51,0.25); }
  .stats-primary .stat-item .num{
    font-family: 'EB Garamond', serif;
    font-weight: 600;
    font-size: 78px;
    color: var(--line);
    display: block;
    line-height: 1;
    margin-bottom: 14px;
  }
  .stats-primary .stat-item .lbl{
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.5px;
  }

  /* secondary — publication breakdown */
  .stats-secondary{
    margin-top: 46px;
    padding: 0 90px;
    display: flex;
  }
  .stats-secondary .stat-item{ flex:1; text-align:center; padding: 0 10px; }
  .stats-secondary .stat-item:not(:last-child){ border-left: 1px solid rgba(32,42,51,0.2); }
  .stats-secondary .stat-item .num{
    font-family: 'EB Garamond', serif;
    font-weight: 600;
    font-size: 46px;
    color: var(--ink);
    display: block;
    line-height: 1;
    margin-bottom: 12px;
  }
  .stats-secondary .stat-item .lbl{
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .bottom{
    margin-top: auto;
    padding: 80px 90px 90px 90px;
  }
  .icon-row{ display:flex; align-items:center; gap: 30px; margin-bottom: 60px; }
  .icon-row .rule{ width:1px; height:200px; background: var(--ink); opacity:0.3; }
  .icon-box{ width:200px; height:200px; }
  .icon-box svg{ width:100%; height:100%; }

  .footer{
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer .index{
    font-family:'EB Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink-soft);
    letter-spacing:1px;
    direction: ltr;
  }
  .footer .caption{
    font-size: 17px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="canvas">

  <div class="watermark"></div>

  <div class="chapter-tag">
    <div class="rule"></div>
    <div class="label">فصل چهارم — مقالات</div>
  </div>

  <div class="content-top">
    <div class="eyebrow">پژوهش و انتشارات · Google Scholar</div>
    <h1>بیش از ۴۲۰ ارجاع علمی<br>به پژوهش‌هایم</h1>
  </div>

  <div class="stats-primary">
    <div class="stat-item">
      <span class="num">424</span>
      <span class="lbl">Citations</span>
    </div>
    <div class="stat-item">
      <span class="num">10</span>
      <span class="lbl">h-index</span>
    </div>
    <div class="stat-item">
      <span class="num">11</span>
      <span class="lbl">i10-index</span>
    </div>
  </div>

  <div class="stats-secondary">
    <div class="stat-item">
      <span class="num">15</span>
      <span class="lbl">مقاله علمی</span>
    </div>
    <div class="stat-item">
      <span class="num">3</span>
      <span class="lbl">مقاله Q1</span>
    </div>
    <div class="stat-item">
      <span class="num">4</span>
      <span class="lbl">مقاله Q2</span>
    </div>
    <div class="stat-item">
      <span class="num">8</span>
      <span class="lbl">نویسنده مسئول</span>
    </div>
  </div>

  <div class="bottom">
    <div class="icon-row">
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="30" width="50" height="62" rx="2" stroke="#A6673D" stroke-width="2" transform="rotate(-6 43 61)"/>
          <rect x="24" y="24" width="50" height="62" rx="2" stroke="#A6673D" stroke-width="2" fill="#EAE3D9"/>
          <line x1="34" y1="38" x2="64" y2="38" stroke="#A6673D" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="34" y1="46" x2="64" y2="46" stroke="#A6673D" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="34" y1="54" x2="52" y2="54" stroke="#A6673D" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="70" cy="68" r="14" fill="#EAE3D9" stroke="#A6673D" stroke-width="2.5"/>
          <path d="M64 68 L68 73 L77 62" stroke="#A6673D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="rule"></div>
    </div>
    <div class="footer">
      <div class="index">4</div>
      <div class="caption">Publications&nbsp;·&nbsp;Overview</div>
    </div>
  </div>

</div>

</body>
</html>
