<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقاله — Distributed Deep Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAE3D9;
    --ink: #202A33;
    --ink-soft: #5B5449;
    --line: #A6673D;
    --outline: rgba(32,42,51,0.08);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d8d2c6; }
  .canvas{
    width: 1080px;
    min-height: 1920px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    font-family: 'Vazirmatn', sans-serif;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  .watermark{
    position: absolute;
    top: 90px;
    right: 30px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 260px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--outline);
    letter-spacing: -4px;
    user-select: none;
  }

  .chapter-tag{
    position: absolute;
    top: 150px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .chapter-tag .rule{ width:1px; height:130px; background: var(--ink); opacity:0.55; }
  .chapter-tag .label{
    writing-mode: vertical-rl;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    font-weight: 300;
  }

  .content-top{
    margin-top: 430px;
    padding: 0 90px;
    text-align: right;
  }
  .content-top .eyebrow{
    font-size: 22px;
    font-weight: 700;
    color: var(--line);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .content-top h1{
    font-size: 50px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.45;
    letter-spacing: -0.5px;
  }

  .detail{
    margin-top: 55px;
    padding: 0 90px;
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }
  .detail .rule{ width:1px; background: var(--ink); opacity:0.35; align-self: stretch; margin-top:6px; }
  .detail .text{ max-width: 680px; }
  .detail .text .institute{
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .detail .text .years{
    display:flex;
    align-items: center;
    gap: 14px;
    font-size: 24px;
    font-weight: 300;
    color: var(--ink-soft);
  }
  .detail .text .years .badge{
    font-size: 15px;
    font-weight: 700;
    color: var(--bg);
    background: var(--line);
    padding: 5px 14px;
    border-radius: 100px;
    letter-spacing: 0.5px;
  }

  .paper-stats{
    margin-top: 50px;
    padding: 34px 90px;
    display: flex;
    border-top: 1px solid rgba(32,42,51,0.25);
    border-bottom: 1px solid rgba(32,42,51,0.25);
  }
  .paper-stats .stat-item{ flex:1; text-align:center; padding: 0 10px; }
  .paper-stats .stat-item:not(:last-child){ border-left: 1px solid rgba(32,42,51,0.25); }
  .paper-stats .stat-item .num{
    font-family: 'EB Garamond', serif;
    font-weight: 600;
    font-size: 64px;
    color: var(--line);
    display: block;
    line-height: 1;
    margin-bottom: 12px;
  }
  .paper-stats .stat-item .lbl{
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.5px;
  }

  .bottom{
    margin-top: auto;
    padding: 70px 90px 90px 90px;
  }
  .icon-row{ display:flex; align-items:center; gap: 30px; margin-bottom: 60px; }
  .icon-row .rule{ width:1px; height:200px; background: var(--ink); opacity:0.3; }
  .icon-box{ width:200px; height:200px; }
  .icon-box svg{ width:100%; height:100%; }

  .footer{
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer .index{
    font-family:'EB Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink-soft);
    letter-spacing:1px;
    direction: ltr;
  }
  .footer .caption{
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="canvas">

  <div class="watermark">Q1</div>

  <div class="chapter-tag">
    <div class="rule"></div>
    <div class="label">فصل چهارم — مقالات</div>
  </div>

  <div class="content-top">
    <div class="eyebrow">مقاله برگزیده</div>
    <h1>From Distributed Machine to Distributed Deep Learning: A Comprehensive Survey</h1>
  </div>

  <div class="detail">
    <div class="rule"></div>
    <div class="text">
      <span class="institute">Journal of Big Data</span>
      <span class="years">2023 <span class="badge">Q1</span> <span class="badge">نویسنده اول و مسئول</span></span>
    </div>
  </div>

  <div class="paper-stats">
    <div class="stat-item">
      <span class="num">50</span>
      <span class="lbl">Citations</span>
    </div>
    <div class="stat-item">
      <span class="num">10.8</span>
      <span class="lbl">Impact Factor</span>
    </div>
  </div>

  <div class="bottom">
    <div class="icon-row">
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="25" y1="25" x2="50" y2="50" stroke="#A6673D" stroke-width="2"/>
          <line x1="75" y1="22" x2="50" y2="50" stroke="#A6673D" stroke-width="2"/>
          <line x1="50" y1="50" x2="22" y2="76" stroke="#A6673D" stroke-width="2"/>
          <line x1="50" y1="50" x2="78" y2="76" stroke="#A6673D" stroke-width="2"/>
          <rect x="17" y="17" width="16" height="16" rx="2" fill="#EAE3D9" stroke="#A6673D" stroke-width="2.5"/>
          <rect x="67" y="14" width="16" height="16" rx="2" fill="#EAE3D9" stroke="#A6673D" stroke-width="2.5"/>
          <rect x="42" y="42" width="16" height="16" rx="2" fill="#EAE3D9" stroke="#A6673D" stroke-width="2.5"/>
          <rect x="14" y="68" width="16" height="16" rx="2" fill="#EAE3D9" stroke="#A6673D" stroke-width="2.5"/>
          <rect x="70" y="68" width="16" height="16" rx="2" fill="#EAE3D9" stroke="#A6673D" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="rule"></div>
    </div>
    <div class="footer">
      <div class="index">4.1</div>
      <div class="caption">Paper&nbsp;·&nbsp;Distributed Deep Learning</div>
    </div>
  </div>

</div>

</body>
</html>
