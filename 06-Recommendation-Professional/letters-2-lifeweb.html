<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>توصیه‌نامه — لایف‌وب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAE3D9;
    --ink: #202A33;
    --ink-soft: #5B5449;
    --line: #A6673D;
    --outline: rgba(32,42,51,0.08);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d8d2c6; }
  .canvas{
    width: 1080px;
    min-height: 1920px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    font-family: 'Vazirmatn', sans-serif;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .watermark{
    position: absolute;
    top: 80px;
    right: 25px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 250px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--outline);
    letter-spacing: -5px;
    user-select: none;
  }
  .chapter-tag{
    position: absolute;
    top: 120px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .chapter-tag .rule{ width:1px; height:110px; background: var(--ink); opacity:0.55; }
  .chapter-tag .label{
    writing-mode: vertical-rl;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    font-weight: 300;
  }
  .content-top{
    margin-top: 300px;
    padding: 0 90px;
    text-align: right;
  }
  .content-top .eyebrow{
    font-size: 21px;
    font-weight: 700;
    color: var(--line);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .content-top h1{
    font-size: 48px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.32;
    letter-spacing: -0.5px;
  }
  .story{
    margin-top: 34px;
    padding: 0 90px;
  }
  .story-text{
    font-size: 27px;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.85;
    text-align: right;
    border-right: 3px solid var(--line);
    padding-right: 22px;
  }
  .doc{
    margin-top: 46px;
    padding: 0 90px;
    display: flex;
    justify-content: center;
  }
  .doc img{
    width: 100%;
    max-width: 760px;
    display: block;
    background: #fff;
    border: 1px solid rgba(32,42,51,0.22);
    box-shadow: 0 10px 34px rgba(32,42,51,0.13);
  }
  .doc-caption{
    margin-top: 16px;
    padding: 0 90px;
    text-align: center;
    font-size: 16px;
    font-weight: 300;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .footer{
    margin-top: auto;
    padding: 46px 90px 70px 90px;
    display:flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(32,42,51,0.18);
    margin-left: 90px;
    margin-right: 90px;
    padding-left: 0;
    padding-right: 0;
  }
  .footer .index{
    font-family:'EB Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink-soft);
    letter-spacing:1px;
    direction: ltr;
  }
  .footer .caption{
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--ink-soft);
  }
  .grid{
    margin-top: 46px;
    padding: 0 90px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
  }
  .grid img{
    width: 100%;
    display: block;
    background: #fff;
    border: 1px solid rgba(32,42,51,0.22);
    box-shadow: 0 8px 26px rgba(32,42,51,0.12);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="chapter-tag">
    <div class="rule"></div>
    <div class="label">فصل هشتم — توصیه‌نامه‌ها</div>
  </div>
  <div class="content-top">
    <div class="eyebrow">لایف‌وب · تهران</div>
    <h1>کارشناس پردازش<br>زبان طبیعی</h1>
  </div>
  <div class="story">
